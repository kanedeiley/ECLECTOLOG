name: Eclectolog

on:
  schedule:
    # Daily at 01:07 UTC = 9:07 PM US Eastern in summer (EDT), 8:07 PM in winter (EST).
    # GitHub cron is always UTC and can't read variables, so edit this line to change it.
    # Off-the-hour minutes get delayed less when GitHub is busy. Helper: https://crontab.guru
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the mixes, don't touch Spotify or the database)"
        type: boolean
        default: false
      user:
        description: "Only this Spotify user ID (blank = everyone)"
        type: string
        required: false
      size:
        description: "Number of tracks (blank = configured default)"
        type: string
        required: false
      seed:
        description: "Random seed for a reproducible mix (blank = random)"
        type: string
        required: false

# Users, Spotify tokens, mix preferences and served history all live in Supabase,
# so the job only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: eclectolog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Users run one at a time with a pause between them (api.user_pause_seconds),
    # roughly 1-2 minutes each.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Every repository variable named ECLECTOLOG_* is picked up from this JSON,
          # so you can add new ones in Settings → Variables without editing this file.
          ECLECTOLOG_VARS_JSON: ${{ toJSON(vars) }}
          # Manual-run inputs override repository variables (blank on scheduled runs).
          ECLECTOLOG_DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          ECLECTOLOG_PLAYLIST_SIZE: ${{ inputs.size }}
          ECLECTOLOG_SEED: ${{ inputs.seed }}
          ONLY_USER: ${{ inputs.user }}
        run: python -m eclectolog --all-users ${ONLY_USER:+--user "$ONLY_USER"}
